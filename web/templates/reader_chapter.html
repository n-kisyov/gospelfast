<div class="flex items-center gap-2 mb-6 flex-wrap">
    <h2 class="text-xl font-semibold dark:text-white">{{.BookName}}</h2>
    {{if gt .Chapter 1}}
    <a href="/reader?t={{$.Selected}}&book={{.BookShort}}&chapter={{sub .Chapter 1}}"
       class="text-xs bg-gray-100 dark:bg-gray-700 dark:text-gray-200 px-2 py-1 rounded hover:bg-gray-200 dark:hover:bg-gray-600">&larr; Prev</a>
    {{end}}
    <form method="get" action="/reader" class="inline-flex items-center gap-1">
        <input type="hidden" name="t" value="{{$.Selected}}">
        <input type="hidden" name="book" value="{{.BookShort}}">
        <input type="number" name="chapter" value="{{.Chapter}}" min="1" max="{{.ChapterCount}}"
               class="border border-gray-300 dark:border-gray-600 dark:bg-gray-800 dark:text-white rounded px-2 py-1 text-sm w-16 text-center">
        <span class="text-xs text-gray-500 dark:text-gray-400">/ {{.ChapterCount}}</span>
        <button type="submit" class="text-xs bg-blue-50 dark:bg-blue-900 text-blue-600 dark:text-blue-300 px-2 py-1 rounded hover:bg-blue-100 dark:hover:bg-blue-800">Go</button>
    </form>
    {{if lt .Chapter .ChapterCount}}
    <a href="/reader?t={{$.Selected}}&book={{.BookShort}}&chapter={{add .Chapter 1}}"
       class="text-xs bg-gray-100 dark:bg-gray-700 dark:text-gray-200 px-2 py-1 rounded hover:bg-gray-200 dark:hover:bg-gray-600">Next &rarr;</a>
    {{end}}
</div>

<div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg p-6">
    <div id="toast" class="fixed top-4 right-4 bg-green-600 text-white text-sm px-4 py-2 rounded-lg shadow-lg z-50 hidden"></div>
    {{range .Verses}}
    <div class="flex gap-3 py-1 border-b border-gray-50 dark:border-gray-700 last:border-0 group">
        <span class="text-xs font-medium text-blue-600 dark:text-blue-400 w-6 flex-shrink-0 text-right pt-0.5 cursor-pointer"
              hx-get="/api/commentary?t=KINGCOMMENTS&book={{$.BookShort}}&ref={{$.BookShort}}.{{$.Chapter}}.{{.Verse}}"
              hx-target="next .commentary-spot" hx-swap="innerHTML" hx-trigger="click"
              title="Click for commentary">{{.Verse}}</span>
        <div class="flex-1 min-w-0">
            <p class="font-serif text-[15px] text-gray-800 dark:text-gray-200 leading-relaxed">{{.Text}}</p>
            <div class="commentary-spot"></div>
        </div>
        <button onclick="copyVerse('{{$.BookName}} {{$.Chapter}}:{{.Verse}} — {{.Text}}')"
                class="opacity-0 group-hover:opacity-100 transition-opacity text-xs text-gray-500 dark:text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 flex-shrink-0 mt-0.5"
                title="Copy verse">📋</button>
    </div>
    {{end}}
</div>
<script>
function copyVerse(text) {
    function show(msg, isErr) {
        var t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.remove('hidden');
        if (isErr) t.style.background = '#dc2626';
        setTimeout(function() { t.classList.add('hidden'); if (isErr) t.style.background = ''; }, 1500);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function() { show('Copied!', false); }).catch(function() { show('Copy failed', true); });
        return;
    }
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); show('Copied!', false); } catch(e) { show('Copy failed', true); }
    document.body.removeChild(ta);
}
</script>
