<!DOCTYPE html>
<html lang="en" x-data="{ dark: localStorage.getItem('dark') === 'true' }" x-init="$watch('dark', v => { localStorage.setItem('dark', v); document.documentElement.classList.toggle('dark', v) })" :class="{ 'dark': dark }">
<head>
    <meta charset="UTF-8">
    <script>
        // Apply the saved theme before first paint so the page never
        // flashes the light background while Alpine.js (loaded with
        // `defer`) is still starting up. Must run synchronously, before
        // any CSS-affecting content is rendered.
        (function () {
            if (localStorage.getItem('dark') === 'true') {
                document.documentElement.classList.add('dark');
            }

            // Resume the last-read chapter when landing on a bare "/reader"
            // link (nav, bookmark, typed URL) with no explicit book/chapter
            // — done here, synchronously in <head> before the body (and its
            // default Genesis 1) ever renders, so there's no visible flash
            // of the wrong chapter before jumping to the real one. The nav
            // link itself is also rewritten (see the script before
            // </body>) so a normal click skips this extra hop entirely;
            // this is the fallback for direct/bookmarked visits.
            if (location.pathname === '/reader' && !location.search) {
                try {
                    var saved = JSON.parse(localStorage.getItem('gospelfast_last_read') || 'null');
                    if (saved && saved.t && saved.book && saved.chapter) {
                        location.replace('/reader?t=' + encodeURIComponent(saved.t) +
                            '&book=' + encodeURIComponent(saved.book) +
                            '&chapter=' + encodeURIComponent(saved.chapter));
                    }
                } catch (e) {}
            }
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <meta name="description" content="{{.MetaDesc}}">
    <meta property="og:title" content="{{.Title}}">
    <meta property="og:description" content="{{.MetaDesc}}">
    <meta property="og:type" content="website">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
    <link href="/static/css/tailwind.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
    <script src="https://unpkg.com/htmx-ext-preload@2" defer></script>
    <script src="https://unpkg.com/alpinejs@3.14.9" defer></script>
</head>
<body class="font-sans bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col transition-colors" x-data="{ menuOpen: false }">
    <nav class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="/" class="text-xl font-bold text-gray-900 dark:text-white tracking-tight">Gospelfast</a>

            <div class="hidden md:flex gap-4 text-sm font-medium items-center">
                <a href="/" class="text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white">Home</a>
                <a href="/reader" data-nav="reader" class="text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white">Reader</a>
                <a href="/genbook" class="text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white">Books</a>
                <a href="/compare" class="text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white">Compare</a>
                <a href="/swagger/index.html" class="text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white">API</a>
                <button @click="dark = !dark"
                        class="ml-2 p-1.5 rounded-lg text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 text-sm">
                    <span x-show="!dark">🌙</span>
                    <span x-show="dark">☀️</span>
                </button>
            </div>

            <div class="flex md:hidden items-center gap-2">
                <button @click="dark = !dark"
                        class="p-1.5 rounded-lg text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 text-sm">
                    <span x-show="!dark">🌙</span>
                    <span x-show="dark">☀️</span>
                </button>
                <button @click="menuOpen = !menuOpen"
                        class="p-2 rounded-lg text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
            </div>
        </div>

        <div x-show="menuOpen" x-transition @click.outside="menuOpen = false"
             class="md:hidden border-t border-gray-200 dark:border-gray-700 px-4 py-2 space-y-1">
            <a href="/" class="block text-sm text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white py-1">Home</a>
            <a href="/reader" data-nav="reader" class="block text-sm text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white py-1">Reader</a>
            <a href="/genbook" class="block text-sm text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white py-1">Books</a>
            <a href="/compare" class="block text-sm text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white py-1">Compare</a>
            <a href="/swagger/index.html" class="block text-sm text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white py-1">API</a>
        </div>
    </nav>

    <main class="flex-1 max-w-6xl mx-auto px-4 py-8 w-full">
        {{.Content}}
    </main>

    <footer class="text-center text-xs text-gray-500 dark:text-gray-400 py-4 border-t border-gray-100 dark:border-gray-800">
        <p>Gospelfast &mdash; The grass withereth, but the word of our God shall stand for ever. Isaiah 40:8</p>
    </footer>

    <script>
        // Point the "Reader" nav link at the last-read chapter, if any, so
        // clicking it resumes reading instead of always landing on
        // Genesis 1. The redirect in <head> above covers direct/bookmarked
        // visits to a bare "/reader"; this covers the common case (clicking
        // the link) without the extra round trip that redirect implies.
        document.querySelectorAll('[data-nav="reader"]').forEach(function (a) {
            try {
                var saved = JSON.parse(localStorage.getItem('gospelfast_last_read') || 'null');
                if (saved && saved.t && saved.book && saved.chapter) {
                    a.href = '/reader?t=' + encodeURIComponent(saved.t) +
                        '&book=' + encodeURIComponent(saved.book) +
                        '&chapter=' + encodeURIComponent(saved.chapter);
                }
            } catch (e) {}
        });
    </script>
</body>
</html>
