{{if .Error}}
    <p class="text-red-500 text-center py-4">{{.Error}}</p>
{{else}}
    <div class="bg-white border border-gray-200 rounded-lg p-3 mb-4">
        <div class="text-sm font-semibold text-gray-700">{{.Reference}}</div>
    </div>
    <div class="grid grid-cols-2 gap-4">
        <div class="bg-white border border-gray-200 rounded-lg p-4">
            <div class="text-sm text-gray-800 leading-relaxed">{{.TextA}}</div>
        </div>
        <div class="bg-white border border-gray-200 rounded-lg p-4">
            <div class="text-sm text-gray-800 leading-relaxed">{{.TextB}}</div>
        </div>
    </div>
{{end}}
