{{if .Error}}
    <p class="text-red-500 dark:text-red-400 text-center py-4">{{.Error}}</p>
{{else}}
    <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg p-3 mb-4">
        <div class="text-sm font-semibold text-gray-700 dark:text-gray-200">{{.Reference}}</div>
    </div>
    <div class="grid grid-cols-2 gap-4">
        <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg p-4">
            <div class="font-serif text-[15px] text-gray-800 dark:text-gray-200 leading-relaxed">{{.TextA}}</div>
        </div>
        <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg p-4">
            <div class="font-serif text-[15px] text-gray-800 dark:text-gray-200 leading-relaxed">{{.TextB}}</div>
        </div>
    </div>
{{end}}
