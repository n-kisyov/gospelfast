{{if .Query}}
    <p class="text-sm text-gray-500 dark:text-gray-400 mb-4">{{.Total}} results for <strong>{{.Query}}</strong>{{if gt .Total 0}} — page {{.Page}}{{end}}</p>
    <div class="space-y-4">
    {{range .Results}}
        <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg p-4 hover:border-blue-300 dark:hover:border-blue-600 transition">
            <div class="text-xs font-semibold text-blue-600 dark:text-blue-400 mb-1">{{.BookShortName}} {{.Chapter}}:{{.Verse}}</div>
            <div class="text-sm text-gray-800 dark:text-gray-200 leading-relaxed">{{.Snippet}}</div>
        </div>
    {{else}}
        <p class="text-gray-400 dark:text-gray-500 text-center py-8">No results found.</p>
    {{end}}
    </div>
    {{if and (gt .Total 0) (gt .NextPage 0)}}
    <div class="text-center mt-6" id="load-more">
        <button hx-get="/search?q={{.Query}}&t={{.Selected}}&page={{.NextPage}}"
                hx-target="#load-more" hx-swap="outerHTML"
                class="text-sm text-blue-600 hover:text-blue-800 dark:text-blue-400 dark:hover:text-blue-300 font-medium">
            Load more results
        </button>
    </div>
    {{end}}
{{end}}
